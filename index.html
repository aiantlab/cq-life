<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CQ Life — 双钢路 → 东水门 → 南滨路</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="topbar">
          <div class="brand">CQ Life <span>双钢路 · 东水门 · 南滨路</span></div>
          <div id="clock">06:00</div>
        </div>
        <div id="needs">
          <div class="need"><label>饥饿</label><div class="bar"><i id="hunger"></i></div></div>
          <div class="need"><label>精力</label><div class="bar"><i id="energy"></i></div></div>
          <div class="need"><label>现金</label><div class="cash" id="cash">¥120</div></div>
        </div>
        <div id="prompt" class="hidden"></div>
        <div id="toast" class="hidden"></div>
        <div id="hint">
          WASD 移动 · Shift 跑 · 鼠标环视 · E 互动 · F 上车/下车 · 向南过桥到南滨路
        </div>
      </div>
      <div id="title">
        <div class="panel">
          <h1>双钢路小区 → 南滨路</h1>
          <p>从渝中大溪沟双钢路钢院出门，步行或驾车经东水门大桥过江，抵达南滨路滨江段：宽马路、湿路反光、江面倒影、夜灯与临江建筑密度。</p>
          <ul>
            <li>小区生活循环仍在：回家吃饭睡觉换衣、便利店购物</li>
            <li>向南出小区门岗沿路即可上桥 · 桌面 Chrome / Edge</li>
          </ul>
          <button id="startBtn" type="button">开始一天</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
